services:
  - type: web
    name: brandsense-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 8000
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["http://localhost:3000","https://brandsense.web.app","https://brandsense.firebaseapp.com"]'
      - key: ENVIRONMENT
        value: production

