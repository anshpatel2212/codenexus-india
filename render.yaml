services:
  # ---------------------------------------------------------------------------
  # BrandSense Next.js Frontend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: brandsense-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_GEMINI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: BACKEND_API_URL
        fromService:
          type: web
          name: brandsense-backend
          property: host

  # ---------------------------------------------------------------------------
  # BrandSense FastAPI Backend Service
  # ---------------------------------------------------------------------------
  - type: web
    name: brandsense-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
